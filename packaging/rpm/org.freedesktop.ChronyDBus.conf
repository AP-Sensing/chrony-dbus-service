<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

        <policy user="root">
                <allow own="org.freedesktop.ChronyDBus"/>
                <allow send_destination="org.freedesktop.ChronyDBus"/>
                <allow receive_sender="org.freedesktop.ChronyDBus"/>
        </policy>

        <policy context="default">
                <allow send_destination="org.freedesktop.ChronyDBus.chronyDBusServer"/>
        </policy>

</busconfig>
