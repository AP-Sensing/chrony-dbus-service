## Builds the (S)RPM and uploads the artifacts

name: build-rpm
on: [workflow_call]
jobs:
  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
      env:
        PROJECT_NAME: ${{ github.repository }}
        BUILD_WORKSPACE: build
    steps:
      - name: Install Dependencies
        id: install-dependencies
        run: |
          echo "${{ github.action }}: Installing dependencies"
          dnf install -y -q rpmdevtools boost-devel cmake cppcheck clang clang-analyzer clang-tools-extra gcc gcc-c++ gtest gtest-devel pkgconf-pkg-config dbus-libs dbus-devel libstdc++ 2>&1 1>/dev/null
      - name: pepare-git
        run: |
            dnf install -y -q git 2>&1 1>/dev/null
            git config --global user.name github-actions
            git config --global user.email github-actions@users.noreply.github.com
      - name: Checkout
        uses: actions/checkout@v5
      - name: build-rpm
        id: build-rpm
        run: |
          git config --global --add safe.directory "$(pwd)" # Ensure the ownership of the .git directory is OK
          rm -rf $BUILD_WORKSPACE # Ensure we start clean
          sed -i "s/set(CPACK_RPM_PACKAGE_RELEASE \"[0-9]\+\")/set(CPACK_RPM_PACKAGE_RELEASE \"${GITHUB_RUN_ID}\")/" packaging/rpm/cpack_config.cmake
          echo "${{ github.action }}: Running cmake . -B"
          cmake . -B $BUILD_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DAPS_CHRONY_DBUS_SERVICE_BUILD_TESTS=OFF -DAPS_CHRONY_DBUS_SERVICE_CPACK_RPM_TYPE=RPM
          echo "${{ github.action }}: Running cmake --build"
          cmake --build $BUILD_WORKSPACE --parallel $PARALLEL
          pushd $BUILD_WORKSPACE
          ../scripts/build_rpm.sh
          popd
          echo "${{ github.action }}: Running cmake . -B"
          cmake . -B $BUILD_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DAPS_CHRONY_DBUS_SERVICE_BUILD_TESTS=OFF -DAPS_CHRONY_DBUS_SERVICE_CPACK_RPM_TYPE=SRPM
          echo "${{ github.action }}: Running cmake --build"
          cmake --build $BUILD_WORKSPACE --parallel $PARALLEL
          pushd $BUILD_WORKSPACE
          ../scripts/build_rpm.sh
          popd
          mkdir -p $BUILD_WORKSPACE/RPM
          rm -rf $BUILD_WORKSPACE/RPM/*
          mv $BUILD_WORKSPACE/*.rpm $BUILD_WORKSPACE/RPM
      - name: rpm-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ${{ github.workspace }}/${{ env.BUILD_WORKSPACE }}/RPM/*.rpm
